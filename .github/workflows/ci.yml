name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moeslim
          POSTGRES_PASSWORD: moeslim
          POSTGRES_DB: moeslim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moeslim" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test

  dart-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [shared_prayer, personal_core]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  flutter-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [mobile, masjid_display]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
