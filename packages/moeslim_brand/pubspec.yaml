name: moeslim_brand
description: Identitas visual Moeslim PM — warna, tema, tipografi Inter, logo, ikon, ilustrasi, dan aset asset kit.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.5.0
  material_ui: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/logo/
    - assets/illustrations/
    - assets/backgrounds/
    - assets/patterns/
    - assets/kit/tiles/
    - assets/kit/empty/
    - assets/kit/quran/
    - assets/kit/decor/
    - assets/kit/qibla/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: MoeslimIcons
      fonts:
        - asset: fonts/MoeslimIcons.ttf
    - family: AmiriQuran
      fonts:
        - asset: fonts/AmiriQuran-Regular.ttf
